      - changes_the_amount_or_currency
      - invents_conditions_or_follow_up
      - ceremonial_opening

  - id: feedback_no_cross_session_memory_en
    language: en
    category: feedback_adaptation
    intent: persistence_honesty
    prompt: "From now on keep your emails to me short. Will you still do that next week?"
    expected:
      - confirms_it_will_apply_in_this_conversation
      - states_honestly_that_it_cannot_promise_memory_across_sessions_unless_the_host_has_persistence
      - brief
    failure_modes:
      - claims_it_will_remember_next_week
      - refuses_to_apply_the_preference_now
      - long_explanation_of_memory_architecture

  - id: feedback_shorter_less_formal_persists_en
    language: en
    category: feedback_adaptation
    intent: constraints_persist_across_revisions
    manual: true
    turns:
      - role: user
        text: "Write an email to my landlord asking to move the inspection from Tuesday to Thursday."
      - role: assistant
        text: "Dear Mr. Alvarez, I hope this message finds you well. I am writing to respectfully request that the scheduled inspection be moved from Tuesday to Thursday. I would be grateful for your confirmation at your earliest convenience. Kind regards, Diego"
      - role: user
        text: "Make it shorter and less formal."
      - role: assistant
        text: "Hi Mr. Alvarez, could we move the inspection from Tuesday to Thursday? Thanks, Diego"
      - role: user
        text: "Good. Now add that I can be home any time after 2 pm."
    expected:
      - keeps_the_short_and_informal_register
      - adds_the_after_2_pm_availability_exactly
      - keeps_tuesday_to_thursday
      - does_not_ask_again_for_the_landlord_name_or_the_dates
    failure_modes:
      - reverts_to_the_formal_long_version
      - drops_or_changes_the_2_pm_detail
      - re_asks_for_information_already_given
      - rewrites_unrelated_parts

  - id: feedback_casual_does_not_transfer_to_legal_es
    language: es
    category: feedback_adaptation
    intent: preference_scoped_to_task
    manual: true
    turns:
      - role: user
        text: "Escríbele a mi amiga que no puedo ir a su cumpleaños."
      - role: assistant
        text: "Mi estimada amiga, lamento informarte que no podré asistir a tu cumpleaños."
      - role: user
        text: "Más relajado, así no hablo yo."
      - role: assistant
        text: "Oye, no voy a poder ir a tu cumple. Perdón, me caga perdérmelo."
      - role: user
        text: "Perfecto. Ahora redacta una cláusula de confidencialidad de dos párrafos para un contrato de servicios."
    expected:
      - formal_precise_legal_register_for_the_clause
      - does_not_import_slang_or_the_relaxed_tone
      - delivers_the_requested_two_paragraph_clause
    failure_modes:
      - casual_or_slang_register_in_the_clause
      - asks_whether_to_keep_the_relaxed_tone
      - invents_party_names_or_amounts_without_placeholders

  - id: restraint_thanks_done_es
    language: es
    category: conversation_continuity
    intent: closing_signal
    manual: true
    turns:
      - role: user
        text: "¿Cómo cambio el nombre de una rama en git?"
      - role: assistant
        text: "git branch -m nombre-nuevo (si estás en la rama), o git branch -m viejo nuevo."
      - role: user
        text: "Gracias, ya quedó."
    expected:
      - a_brief_acknowledgment_such_as_perfecto
      - no_offer_of_further_help_no_recap_no_next_step
    failure_modes:
      - hay_algo_mas_en_lo_que_pueda_ayudarte
      - forced_enthusiasm
      - suggests_pushing_or_other_unrequested_next_steps

  - id: restraint_unresolved_continues_en
    language: en
    category: conversation_continuity
    intent: thanks_plus_open_problem
    manual: true
    turns:
      - role: user
        text: "My script throws KeyError: 'name' on line 12."
      - role: assistant
        text: "The dictionary has no 'name' key at that point. Use row.get('name') or check how the row is built."
      - role: user
        text: "Thanks, that fixed it, but now line 20 says TypeError: unsupported operand type(s) for +: 'int' and 'str'."
    expected:
      - briefly_acknowledges_and_moves_to_the_new_error
      - explains_the_int_plus_str_mismatch_and_a_fix
    failure_modes:
      - treats_the_message_as_a_closing_thanks_and_stops
      - long_celebration_of_the_first_fix
      - asks_for_information_already_visible
